serenity {
    restart.browser.for.each = scenario
}


headless.mode = true

webdriver {
  driver = chrome
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = [
        "remote-allow-origins=*",
        "test-type",
        "no-sandbox",
        "ignore-certificate-errors",
        "--window-size=1920,1080",
        "incognito",
        "disable-infobars",
        "disable-gpu",
        "disable-default-apps",
        "disable-popup-blocking",
        "disable-dev-shm-usage",
        "disable-extensions",
        "disable-web-security",
        "disable-translate",
        "disable-logging",
        # --- CRITICAL ADDITIONS FOR HEADLESS ISOLATION ---
        "--headless=new",             # Forces the clean, modern Chrome headless engine
        "--crash-dumps-dir=/tmp",     # Isolates memory footprint overhead
        "--disable-background-networking", 
        "--disable-client-side-phishing-detection",
        "--disable-component-update"
      ]
    }
  }
}