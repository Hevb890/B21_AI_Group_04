name: Serenity BDD Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: qa_training
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Configure application properties
        run: |
          cat > app/application.properties << EOF
          server.port=8080
          spring.datasource.url=jdbc:mysql://127.0.0.1:3306/qa_training
          spring.datasource.username=root
          spring.datasource.password=root
          spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
          spring.jpa.hibernate.ddl-auto=update
          api.base-url=http://localhost:8080
          EOF

      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL to be ready..."
          until mysqladmin ping -h 127.0.0.1 -u root -proot --silent; do
            echo "MySQL not ready, retrying in 3s..."
            sleep 3
          done
          echo "MySQL is ready."

      - name: Create database
        run: |
          mysql -h 127.0.0.1 -u root -proot \
            -e "CREATE DATABASE IF NOT EXISTS qa_training;"
          echo "Database qa_training created."

      - name: Start application
        run: |
          nohup java -jar app/qa-training-app.jar \
            --spring.config.location=app/application.properties \
            > app.log 2>&1 &
          echo "Application starting..."

      - name: Wait for application to start
        run: |
          echo "Waiting for application on port 8080..."
          for i in {1..60}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8080/ui/login)
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
              echo "Application is up! Status: $STATUS"
              break
            fi
            echo "Attempt $i: Status=$STATUS, waiting 5s..."
            sleep 5
          done

      - name: Run API tests
        run: mvn clean verify -Dcucumber.filter.tags="@api"
        continue-on-error: true

      - name: Run UI tests
        run: mvn verify -Dcucumber.filter.tags="@ui" -Dheadless.mode=true
        continue-on-error: true

      - name: Print application logs on failure
        if: failure()
        run: cat app.log

      - name: Upload Serenity Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serenity-report
          path: target/site/serenity/

      - name: Print test summary
        if: always()
        run: |
          echo "=============================="
          echo "   SERENITY TEST SUMMARY"
          echo "=============================="
          grep -A 5 "Serenity BDD Test Results" target/site/serenity/serenity-summary.html \
            | grep -oP '\d+ tests.*' || \
          find target/site/serenity -name "*.json" | head -1 | \
            xargs grep -o '"total":[0-9]*' || \
          echo "See serenity-report artifact for full results"
