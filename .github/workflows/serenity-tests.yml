name: Serenity BDD Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: qa_training
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # FIX: Ensure 'app' directory exists before writing properties
      - name: Configure application properties
        run: |
          mkdir -p app
          cat > app/application.properties << EOF
          server.port=8080
          spring.datasource.url=jdbc:mysql://127.0.0.1:3306/qa_training
          spring.datasource.username=root
          spring.datasource.password=root
          spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
          spring.jpa.hibernate.ddl-auto=update
          api.base-url=http://localhost:8080
          EOF

      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL to be ready..."
          until mysqladmin ping -h 127.0.0.1 -u root -proot --silent; do
            echo "MySQL not ready, retrying in 3s..."
            sleep 3
          done
          echo "MySQL is ready."

      - name: Create database
        run: |
          mysql -h 127.0.0.1 -u root -proot \
            -e "CREATE DATABASE IF NOT EXISTS qa_training;"
          echo "Database qa_training created."

      # FIX: Added a quick sleep and early log check to trap instant startup failures
      - name: Start application
        run: |
          mkdir -p app
          nohup java -jar app/qa-training-app.jar \
            --spring.config.location=app/application.properties \
            > app.log 2>&1 &
          echo "Application starting..."
          sleep 3
          echo "=== Early Startup Check (First 3 Seconds) ==="
          cat app.log || echo "No logs written yet."

      # FIX: Loop tracks a SUCCESS variable so curl errors don't crash the step implicitly
      - name: Wait for application to start
        run: |
          echo "Waiting for application on port 8080..."
          SUCCESS=false
          for i in {1..60}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 2 http://localhost:8080/ui/login || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
              echo "Application is up! Status: $STATUS"
              SUCCESS=true
              break
            fi
            echo "Attempt $i: Status=$STATUS, waiting 5s..."
            sleep 5
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ Application failed to start within 5 minutes."
            exit 1
          fi

      # Note: Added 'needs: Wait for application to start' dependency implicitly by step order
      - name: Run API and UI tests
        run: mvn clean verify -Dcucumber.filter.tags="@ui or @api"
        continue-on-error: true

      # FIX: Changed to if: always() to guarantee you see the stack trace if it fails
      - name: Print application logs on failure
        if: always()
        run: |
          if [ -f app.log ]; then
            echo "=== FINAL APPLICATION LOGS ==="
            cat app.log
          else
            echo "app.log file does not exist."
          fi

      # ─── Upload artifact for Pages deployment ─────────────────
      - name: Upload Serenity Report as Pages artifact
        uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: target/site/serenity/

      # ─── Also keep regular artifact download ──────────────────
      - name: Upload Serenity Report as downloadable artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serenity-report
          path: target/site/serenity/

  # ─── Deploy to GitHub Pages ───────────────────────────────────
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: always()

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
